[package]
name = "xtask"
version = "1.3.3"
edition = "2024"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
flate2 = "1"
xz2 = { version = "0.1", features = ["static"] }
tar = "0.4"
tempfile = "3"
ureq = "3"
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
cargo_metadata = "0.23"
