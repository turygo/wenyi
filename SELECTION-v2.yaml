    - chapter_index: 3
      segment_index: 244
      target: “他是个什么样的人？”
    answer_key: 开头的“he”指阿黛拉的少年儿子阿瑟；随后“Is he a patriarch?”中的“he”转指孩子的父亲格雷厄姆。
    rationale: 前文先明确阿瑟已经是少年，目标段随后谈“少年”和“维多利亚时代的父亲”，两个相同代词的指代发生了切换。
