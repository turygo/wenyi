    answer_key: 目标段先引用第一份仍称“一切安好”的记录，随后切换到边缘处颤抖笔迹写下的第二份记录；两份记录的时间和状态不能合并。
    rationale: 前文明确引出“第一条消息”，目标段内部再引出第二条消息；保留这层跨段结构才能正确理解探险队状况的逆转。
