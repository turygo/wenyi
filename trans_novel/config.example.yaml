# trans-novel 配置（多语言小说 → 中文）
# 改这里就能调整行为，不用动代码：模型路由、Provider 目录、流水线开关都在这。

language:
  # 来源语言：auto 让模型自动识别；也可写死语言代码，如 ja / en / ko / ru / de
  source: auto
  # 译文语言
  target: zh

# ── LLM ──────────────────────────────────────────────────────────────────
# 配置分两段：
#   llm.providers：Provider 别名 → 端点/凭据/超时/重试 + 命名模型目录
#     （目录键是用户别名，id 是发给服务的精确模型 ID；同一个服务 ID 需要不同
#      推理设置时必须拆成多个模型别名，如 flash-thinking / flash-fast）。
#   llm.agents：六个功能 Agent 路由 → primary 模型 + fallback 降级列表。
#     translator        正文翻译、定向重译、标题翻译（translate.batch/lint_fix/review_fix、
#                       title.translate）
#     editor            润色、去翻译腔改写（polish.batch、naturalize.rewrite）
#     reviewer          章末审校、一致性 QA、回译比对、去翻译腔检测（review.chapter、
#                       consistency.check、backtranslate.check、naturalize.screen/pair/fidelity、
#                       language.detect）
#     analyst           全局分析、一次性定名、术语审计（analyzer.analyze、prescan.name_terms、
#                       glossary.audit）
#     preparer          全书预扫、章节梗概、术语候选挖掘/抽取（prescan.digest/book_synopsis/
#                       term_mine、glossary.extract）
#     light-translator  回译、附属章粗翻（backtranslate.translate、translate.back_matter）
# 所有模型引用形如 <provider-alias>:<model-alias>，按第一个冒号切分（冒号在
# model 别名内合法，如 local:qwen3:32b）。Provider 类型可选 deepseek、openai、
# openrouter、openai-compatible、custom、ollama、vllm 或 fake。
# OpenAI-compatible/custom 必须设置 base_url；Ollama/vLLM 使用各自本地默认 URL。
# DeepSeek/OpenAI/OpenRouter 使用各自默认密钥环境变量，可用 api_key_env 覆盖。
llm:
  providers:
    deepseek:
      type: deepseek
      base_url: https://api.deepseek.com
      api_key_env: DEEPSEEK_API_KEY
      # 单次请求超时（秒）；开思考时耗时较长，别设太小
      timeout: 600
      # 请求失败后的重试次数（间隔逐次拉长）
      max_retries: 4
      models:
        pro:
          # 翻译 / 润色 / 全局分析 / 起标题 / 定名（开思考）
          id: deepseek-v4-pro
          reasoning: {enabled: true, effort: high}
        flash-thinking:
          # 审校 / 一致性检查 / 回译比对等判断类（保留思考）
          id: deepseek-v4-flash
          reasoning: {enabled: true, effort: high}
        flash-fast:
          # 梗概 / 全书概览 / 术语抽取 / 回译等机械任务（不开思考）
          id: deepseek-v4-flash
          reasoning: {enabled: false}
  agents:
    translator:
      model: deepseek:pro
      fallback: []
    editor:
      model: deepseek:pro
      fallback: []
    reviewer:
      model: deepseek:flash-thinking
      fallback: []
    analyst:
      model: deepseek:pro
      fallback: []
    preparer:
      model: deepseek:flash-fast
      fallback: []
    light-translator:
      model: deepseek:flash-fast
      fallback: []

# ── 切分 ─────────────────────────────────────────────────────────────────
segment:
  # 每个翻译批次的目标大小（按字符数粗估 token）
  max_chars_per_batch: 1800
  # 单段超过这个长度就在句末标点处再切开，翻译后仍合并回原段，避免出现超长段落
  max_chars_per_segment: 1200

# ── 流水线开关（在质量和成本之间取舍）──────────────────────────────────
pipeline:
  # 每章译完后整章审校：查漏译、误译、术语、人称
  review: true
  # 审校发现严重问题（漏译 / 误译）后自动重译；审校只盯专名和真正的语义错误，误报少
  autofix_severe: true
  # 译文与原文对不齐时的重试上限
  align_retry_limit: 2
  # 完整回执无效时对单段额外重试次数（0～5）
  review_output_retries: 2
  # 润色（editor 默认与 translator 使用同一模型 deepseek:pro）：相当于用 pro 把全书再翻一遍，最费钱，默认关
  polish: true
  # 回译抽检的比例（0 表示关闭）
  backtranslate_sample: 0
  # 全书翻完后再做一次跨章一致性检查
  consistency_qa: false
  # 注入给译者参考的前文译文段落数（保持上下文连贯）
  rolling_context_segments: 6
  # 翻译前先通读原文，生成全书概览和每章梗概注入翻译，让译者对整本书心里有数；
  # 全书概览是固定前缀，能命中缓存反复复用。关掉可省去这次预扫的成本
  book_understanding: true
  # 预扫每章梗概时的并发线程数（各章互不影响，1 为串行）
  prescan_concurrency: 4
  # 术语注入范围：chapter 只注入本章出现的词条加锁定的人物名（长书省 token）；full 注入整张术语表
  glossary_scope: chapter
  # 附属章（前言 / 注释 / 索引 / 参考文献 / 致谢等，按标题关键词和全书首尾位置识别）的处理档位：
  # skip 原文直接输出、不花钱；light 快速粗翻（light-translator Agent，operation=translate.back_matter），
  # 跳过审校 / 润色 / 回译（省成本）；full 走完整流水线。
  # 任何档位都不从附属章抽术语（里面的人名书名会污染全书术语表）。填错值启动即报错。
  back_matter: light
  # 是否在翻译过程中从已译内容里回收术语：false（默认）只用翻译前一次性定名的结果，
  # 翻译期术语表只读，避免把初稿的直译固化成全书标准、也避免制造假冲突；
  # true 恢复旧行为（边译边抽 + 章末抽取），日文轻小说称呼变体、口癖多时建议开
  inflight_glossary: false
  # 去翻译腔：只看中文译文来审读并改写，改动要过三道关卡才采纳；
  # 已译章节不会自动补做，老书想补跑用 `tools naturalize`
  naturalize: true

# ── 敬称策略（源文为日语时生效，其它语言一般用不到）────────────────────
honorific:
  # keep_style 体现语气（前辈 / 小X / X君…）；normalize 按统一规则处理；drop 直接省略
  strategy: keep_style

# ── 标点规范化（统一成简体中文大陆常用的全角标点）───────────────────────
punctuation:
  normalize: true

# ── 路径 ─────────────────────────────────────────────────────────────────
paths:
  # 运行状态、各章中间产物、术语库的存放目录
  state_dir: state

# ── 双语输出 ───────────────────────────────────────────────────────────────
output:
  # 输出纯中文版
  mono: true
  # 输出双语对照版（原文淡化显示）
  bilingual: true
  # 双语顺序：target_first 译文在上原文在下；source_first 原文在上
  bilingual_order: target_first
