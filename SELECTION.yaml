      target: 卡尔：甜甜圈。别出声。你能看到这条消息吗？
    answer_key: 冒号后的内容是卡尔和甜甜圈通过界面进行的无声文字交流，不是当面说出的对白；大写表示甜甜圈在文字频道里激动地“喊”。
    rationale: 前文明示“别出声”和“能看到这条消息吗”，决定了目标段对话的媒介和语气。
