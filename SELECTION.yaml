      target: 首先，中国《公司法》把有限责任公司（LLC）的股东人数限制为五十人。[33] 多年来任正非一直把股份作为薪酬的重要部分发给员工，因此华为的股东早已远超这一数字。一名前高管称，华为管理层只持有 3%，任正非本人不到 1%。[34] 深圳市政府意识到这一障碍，于 1997 年 9 月为本地企业提出变通办法：把所有员工股东统一登记在一个“工会”名下，由工会在法律上充当单一股东。[35] 华为采用了这一办法并延续至今，也因此引发了大量困惑和对股权结构不透明的指责。纸面上，华为只有两名股东：持股约 1% 的任正非本人，以及代表其余股份的工会。华为高管后来称，这种所有权结构是历史遗留的特殊现象，如今中国的新公司甚至已不允许采用。徐直军 2012 年说：“当然，按现行法律它是不合法的，但当年经济特区的特别批准是合法的。”[36] 他指出，全国约有一千家公司获得过这种特别批准。华为获准保留这一结构，或许说明政府官员承认，公司的做法虽不合常规，却行之有效。
    answer_key: “LLC”指有限责任公司；这里的“trade union”是把大量员工股东在法律登记上合并为一个股东的持股载体。目标段所说的重组和回购原始投资者股份，都受这一法律背景约束。
    rationale: 前文给出五十名股东上限及工会代持安排，目标段才能解释华为为何需要重新设计股权结构。
