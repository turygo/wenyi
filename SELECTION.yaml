      target: 卡丁厄姆动作优雅地爬到地板上。
    answer_key: “bridge”不是桥梁，而是穿越者对其现代联络员或监护人的角色称呼；本段中的“my bridge”指叙述者。
    rationale: 前文和目标段都处于穿越者与现代联络员的关系语境；按字面译成“我的桥”会破坏人物关系。
- subset: context
  book_id: formal-01
  chapter_index: 3
  start_segment_index: 245
  end_segment_index: 254
  strata: []
  context:
    challenge_type: pronoun_reference
    source_before:
    - chapter_index: 3
      segment_index: 242
    - chapter_index: 3
