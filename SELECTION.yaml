    - chapter_index: 3
      segment_index: 19
      target: 我猛地站起来，心脏因恐慌而灼痛。他几乎从不用我的名字——我的真名——而不是“小猫”或“我的桥”；可这次他叫了我的名字，发音准确，而且他从一开始就知道。我冲进走廊。他的样子糟透了，脸色惨白，满脸是汗。
    answer_key: “he”指格雷厄姆；“Maggie”是玛格丽特的昵称；“little cat”和“my bridge”是格雷厄姆对叙述者使用的称呼。
    rationale: 前文通过格雷厄姆异常地叫出叙述者真名来标记紧急状态，目标段中的人物和昵称必须沿用这一人物关系。
