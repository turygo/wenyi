[package]
name = "wenyi-book"
version = "1.3.3"
edition = "2024"
rust-version = "1.96"
build = "build.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
wenyi-core = { path = "../wenyi-core" }
zip = { version = "=9.0.1", default-features = false, features = ["deflate-flate2-zlib-rs", "bzip2", "lzma"] }
sha2 = "0.10"
serde_json = { version = "1", features = ["preserve_order"] }
same-file = "1"
indexmap = "2"
percent-encoding = "2"
fluent-uri = "0.4"
lightningcss = { version = "=1.0.0-alpha.72", default-features = false, features = ["into_owned"] }
selectors = "=0.41.0"
cssparser = "0.38"
precomputed-hash = "0.1"
static-self = "0.1"

[build-dependencies]
cc = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
serde_json = "1"
sha2 = "0.10"
zip = { version = "=9.0.1", default-features = false, features = ["deflate-flate2-zlib-rs", "bzip2", "lzma"] }
