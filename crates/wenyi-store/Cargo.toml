[package]
name = "wenyi-store"
version = "1.3.3"
edition = "2024"
rust-version = "1.96"

[dependencies]
wenyi-core = { path = "../wenyi-core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
base64 = "0.22"
same-file = "1"
rusqlite = { version = "=0.40.2", features = ["bundled"] }

url = "2"
[dev-dependencies]
tempfile = "3"
