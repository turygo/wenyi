[package]
name = "wenyi-cli"
version = "1.3.3"
edition = "2024"
rust-version = "1.96"

[[bin]]
name = "wenyi"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", default-features = false, features = ["std", "help", "usage", "error-context"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
