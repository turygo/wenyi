[package]
name = "wenyi-app"
version = "1.3.3"
edition = "2024"
rust-version = "1.96"

[dependencies]
wenyi-core = { path = "../wenyi-core" }
wenyi-book = { path = "../wenyi-book" }
wenyi-store = { path = "../wenyi-store" }
sha2 = "0.10"
same-file = "1"
serde-saphyr = { version = "1", default-features = false, features = ["deserialize"] }
serde_json = { version = "1", features = ["preserve_order"] }
dirs = "6"

[target.'cfg(unix)'.dependencies]
uzers = "0.12"

[dev-dependencies]
tempfile = "3"
