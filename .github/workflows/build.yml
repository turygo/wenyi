name: Build executables

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/build.yml
      - pyproject.toml
      - scripts/prepare_release.py
      - trans_novel/config.example.yaml
      - trans_novel/__main__.py
      - trans_novel/cli.py
      - trans_novel/config.py
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  prepare:
    name: Validate release metadata
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate tag and extract release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: >
          python scripts/prepare_release.py
          --tag "$GITHUB_REF_NAME"
          --output release-notes.md

      - name: Upload release notes
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 1

  build:
    needs: prepare
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            python_arch: x64
            artifact: wenyi-windows-x64
            binary: ./dist/wenyi.exe
            archive: ./dist/wenyi-windows-x64.zip
            expected_machine: "8664"
          - name: Linux x64
            runner: ubuntu-latest
            python_arch: x64
            artifact: wenyi-linux-x64
            binary: ./dist/wenyi
            archive: ./dist/wenyi-linux-x64.tar.gz
            expected_arch: x86-64
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            python_arch: arm64
            artifact: wenyi-linux-arm64
            binary: ./dist/wenyi
            archive: ./dist/wenyi-linux-arm64.tar.gz
            expected_arch: aarch64
          - name: macOS Apple Silicon
            runner: macos-15
            python_arch: arm64
            artifact: wenyi-macos-arm64
            binary: ./dist/wenyi
            archive: ./dist/wenyi-macos-arm64.tar.gz
            expected_arch: arm64
          - name: macOS Intel
            runner: macos-15-intel
            python_arch: x64
            artifact: wenyi-macos-x64
            binary: ./dist/wenyi
            archive: ./dist/wenyi-macos-x64.tar.gz
            expected_arch: x86_64

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python_arch }}

      - name: Install build dependencies
        run: python -m pip install . pyinstaller

      - name: Build single-file executable
        run: >
          python -m PyInstaller --name wenyi --onefile --clean --noconfirm
          --paths . --collect-all ebooklib --collect-all bs4 --collect-all lxml
          --collect-all openai --collect-all pydantic --collect-all yaml
          --collect-data trans_novel --copy-metadata trans-novel
          --workpath build/pyinstaller --specpath build/pyinstaller-spec
          --distpath dist trans_novel/__main__.py

      - name: Smoke test executable
        run: |
          ${{ matrix.binary }} --help
          ${{ matrix.binary }} --version

      - name: Smoke test config and input validation on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ${{ matrix.binary }} --config dist/smoke-config.yaml init
          if ($LASTEXITCODE -ne 0) {
            throw "Executable failed to create the default config"
          }
          if (-not (Test-Path dist/smoke-config.yaml)) {
            throw "Executable did not create the default config"
          }
          & ${{ matrix.binary }} --config dist/smoke-config.yaml translate dist/missing.txt
          if ($LASTEXITCODE -eq 0) {
            throw "Expected the missing input check to fail"
          }
          exit 0

      - name: Smoke test config and input validation on POSIX
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ${{ matrix.binary }} --config dist/smoke-config.yaml init
          test -s dist/smoke-config.yaml
          if ${{ matrix.binary }} --config dist/smoke-config.yaml translate dist/missing.txt; then
            echo "Expected the missing input check to fail" >&2
            exit 1
          fi

      - name: Verify Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bytes = [System.IO.File]::ReadAllBytes("${{ matrix.binary }}")
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          $actual = "{0:X4}" -f $machine
          Write-Host "PE machine: 0x$actual"
          if ($actual -ne "${{ matrix.expected_machine }}") {
            throw "Expected PE machine 0x${{ matrix.expected_machine }}, got 0x$actual"
          }

      - name: Verify Linux executable
        if: runner.os == 'Linux'
        shell: bash
        run: |
          file_output="$(file "${{ matrix.binary }}")"
          echo "$file_output"
          grep -q "${{ matrix.expected_arch }}" <<<"$file_output"

      - name: Verify macOS executable
        if: runner.os == 'macOS'
        shell: bash
        run: |
          file_output="$(file "${{ matrix.binary }}")"
          echo "$file_output"
          grep -q "${{ matrix.expected_arch }}" <<<"$file_output"
          codesign --verify --deep --strict "${{ matrix.binary }}"

      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: >
          Compress-Archive -LiteralPath dist/wenyi.exe
          -DestinationPath "${{ matrix.archive }}" -Force

      - name: Package POSIX executable
        if: runner.os != 'Windows'
        shell: bash
        run: tar -czf "${{ matrix.archive }}" -C dist wenyi

      - name: Upload packaged executable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes

      - name: Download packaged executables
        uses: actions/download-artifact@v4
        with:
          pattern: wenyi-*
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        working-directory: release-assets
        run: sha256sum wenyi-* > SHA256SUMS.txt

      - name: Create release with assets and changelog notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" release-assets/* \
            --repo "$GH_REPO" \
            --verify-tag \
            --title "$TAG" \
            --notes-file release-notes.md
