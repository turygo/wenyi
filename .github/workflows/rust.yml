name: Rust R1 native admission

on:
  workflow_dispatch:
  push:
    branches: [r1-acceptance-20261012]

permissions:
  contents: read

jobs:
  r1:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - name: Linux x64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: macOS ARM64
            runner: macos-15
            target: aarch64-apple-darwin
          - name: macOS x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
    env:
      CMAKE: cmake
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Select native source cache
        shell: bash
        run: printf '%s\n' 'WENYI_NATIVE_CACHE=${{ runner.temp }}/wenyi-native-r1' >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: 4.1.3
      - name: Install Cygwin shell and make
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest https://cygwin.com/setup-x86_64.exe -OutFile "$env:RUNNER_TEMP\cygwin-setup.exe"
          $process = Start-Process -FilePath "$env:RUNNER_TEMP\cygwin-setup.exe" -ArgumentList @('--quiet-mode', '--no-desktop', '--no-shortcuts', '--root', 'C:\cygwin64', '--site', 'https://mirrors.kernel.org/sourceware/cygwin/', '--packages', 'bash,make,coreutils,diffutils,sed,gawk,grep') -Wait -PassThru
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
          'C:\cygwin64\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          'BASH=C:/cygwin64/bin/bash.exe' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'MAKE=C:/cygwin64/bin/make.exe' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'CC=cl' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'CXX=cl' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Select MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Prefer MSVC tools over Cygwin
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msvcBin = Join-Path $env:VCToolsInstallDir 'bin\Hostx64\x64'
          if (-not (Test-Path (Join-Path $msvcBin 'link.exe'))) { throw 'MSVC linker is missing' }
          $msvcBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Provision verified pinned native sources
        run: cargo run --locked -p xtask -- native provision --cache "${{ env.WENYI_NATIVE_CACHE }}"
      - name: Rust architecture and budgets
        run: cargo run --locked -p xtask -- architecture
      - name: Changelog contents
        run: cargo run --locked -p xtask -- changelog
      - name: Check format
        run: cargo fmt --all -- --check
      - name: Check all owned Rust targets
        run: cargo clippy --workspace --all-targets --all-features --locked --target ${{ matrix.target }} -- -D warnings
      - name: Run owner contracts and actual EPUB init/status processes
        run: cargo test --workspace --all-targets --all-features --locked --target ${{ matrix.target }}
      - name: Build native production executable
        run: cargo build --release --locked -p wenyi-cli --bin wenyi --target ${{ matrix.target }}
      - name: Upload executable and native provenance
        uses: actions/upload-artifact@v4
        with:
          name: r1-${{ matrix.runner }}
          path: |
            target/${{ matrix.target }}/release/wenyi
            target/${{ matrix.target }}/release/wenyi.exe
            target/${{ matrix.target }}/release/build/wenyi-book-*/out/native-build.json
            target/${{ matrix.target }}/release/build/wenyi-book-*/out/native-notices/**
          if-no-files-found: error
          retention-days: 14
